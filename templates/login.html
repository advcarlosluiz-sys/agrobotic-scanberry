{% extends "base.html" %}
{% block title %}Login — ScanBerry{% endblock %}
{% block content %}
<div style="max-width:420px;margin:0 auto">
    <h1 style="text-align:center;margin-bottom:.5rem">🍓 Entrar</h1>
    <p style="text-align:center;color:var(--text-muted);margin-bottom:1.5rem">Acesse sua conta ScanBerry</p>

    <form method="POST" action="{{ url_for('login') }}">
        <div class="card">
            <div class="form-group">
                <label>WhatsApp</label>
                <input type="tel" name="whatsapp" class="form-control" placeholder="(11) 99999-9999" required>
            </div>

            <div class="form-group">
                <label>Senha</label>
                <input type="password" name="senha" class="form-control" placeholder="Sua senha" required>
            </div>

            <button type="submit" class="btn btn-primary btn-lg" style="width:100%;justify-content:center">
                🔓 Entrar
            </button>
        </div>
    </form>

    <p style="text-align:center;margin-top:1.2rem;color:var(--text-muted)">
        Não tem conta? <a href="{{ url_for('cadastro') }}">Criar conta grátis</a>
    </p>
</div>
{% endblock %}
